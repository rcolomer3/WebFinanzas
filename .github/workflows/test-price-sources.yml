name: Test price sources

on:
  push:
    branches:
      - improve-price-source-validation-20261009
    paths:
      - "scripts/test_price_sources.py"
      - ".github/workflows/test-price-sources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Probe Fidelity and gold sources
        run: python scripts/test_price_sources.py
