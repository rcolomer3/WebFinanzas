name: Update asset prices

on:
  push:
    branches:
      - main
    paths:
      - "scripts/*.py"
      - ".github/workflows/update-prices.yml"
  schedule:
    - cron: "17 8 * * *"
      timezone: "Europe/Madrid"
    - cron: "47 8 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-asset-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether scheduled update is needed
        id: guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open("prices.json", "r", encoding="utf-8") as fh:
              data = json.load(fh)

          today = datetime.now(ZoneInfo("Europe/Madrid")).date().isoformat()
          updated = str(data.get("updatedAt", ""))[:10]
          should_run = updated != today

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"should_run={'true' if should_run else 'false'}\n")

          print(f"prices.json date={updated or 'none'}, today={today}, should_run={should_run}")
          PY

      - name: Set up Python
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Update main assets
        if: steps.guard.outputs.should_run == 'true'
        run: python scripts/update_prices.py

      - name: Update gold from Stooq fallback
        if: steps.guard.outputs.should_run == 'true'
        run: python scripts/update_gold_stooq.py

      - name: Show resulting prices.json
        if: steps.guard.outputs.should_run == 'true'
        run: cat prices.json

      - name: Commit and push changes
        if: steps.guard.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add prices.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update asset prices"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict. Rebuilding prices.json from latest main..."
              git rebase --abort || true
              git reset --hard origin/main
              python scripts/update_prices.py
              python scripts/update_gold_stooq.py
              git add prices.json

              if git diff --cached --quiet; then
                echo "No changes remain after rebuilding"
                exit 0
              fi

              git commit -m "Update asset prices"
            fi

            if git push origin HEAD:main; then
              echo "prices.json pushed successfully"
              exit 0
            fi

            echo "Push failed because main changed again; retrying..."
            sleep 2
          done

          echo "Failed to push prices.json after 3 attempts"
          exit 1
